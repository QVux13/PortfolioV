<style>
    .home-section {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 4rem;
        position: relative;
        overflow: hidden;
    }
    .home-content {
        text-align: center;
        max-width: 950px;
        position: relative;
        z-index: 2;
    }
    .greeting {
        font-size: 1.1rem;
        color: #2dd4bf;
        font-weight: 600;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        opacity: 0;
        animation: fadeInUp 0.8s ease forwards;
    }
    .home-title {
        font-size: 4.2rem;
        font-weight: 800;
        color: white;
        margin-bottom: 1.5rem;
        line-height: 1.1;
        letter-spacing: -0.04em;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.2s forwards;
        font-family: 'Poppins', sans-serif;
    }
    .home-title span {
        background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .home-subtitle {
        font-size: 1.9rem;
        color: #d1d5db;
        font-weight: 300;
        margin-bottom: 2.5rem;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.4s forwards;
    }
    .home-description {
        font-size: 1.1rem;
        color: #9ca3af;
        max-width: 620px;
        margin: 0 auto 3rem;
        line-height: 1.85;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.6s forwards;
    }
    .home-buttons {
        display: flex;
        gap: 1.2rem;
        justify-content: center;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.8s forwards;
    }
    .btn-primary {
        background: linear-gradient(135deg, #14b8a6 0%, #0891b2 100%);
        color: white;
        padding: 1rem 2.8rem;
        border-radius: 3rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        box-shadow: 0 4px 20px rgba(20, 184, 166, 0.45), 0 0 0 0 rgba(20,184,166,0.4);
        position: relative;
        overflow: hidden;
    }
    .btn-primary::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        transition: left 0.5s;
    }
    .btn-primary:hover::before { left: 100%; }
    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(20, 184, 166, 0.55);
    }
    .btn-secondary {
        border: 1.5px solid rgba(20, 184, 166, 0.5);
        color: #2dd4bf;
        background: rgba(20, 184, 166, 0.06);
        padding: 1rem 2.8rem;
        border-radius: 3rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        backdrop-filter: blur(10px);
    }
    .btn-secondary:hover {
        background: #14b8a6;
        border-color: #14b8a6;
        color: white;
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(20, 184, 166, 0.35);
    }
    .floating-elements {
        position: absolute;
        width: 100%; height: 100%;
        top: 0; left: 0;
        pointer-events: none;
        z-index: 1;
    }
    .float-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        animation: floatOrb 8s ease-in-out infinite;
        opacity: 0.12;
    }
    .float-orb:nth-child(1) {
        width: 200px; height: 200px;
        background: radial-gradient(circle, #14b8a6, transparent);
        top: 10%; left: 5%;
        animation-delay: 0s;
    }
    .float-orb:nth-child(2) {
        width: 150px; height: 150px;
        background: radial-gradient(circle, #818cf8, transparent);
        top: 60%; right: 10%;
        animation-delay: 3s;
    }
    .float-orb:nth-child(3) {
        width: 100px; height: 100px;
        background: radial-gradient(circle, #06b6d4, transparent);
        bottom: 15%; left: 25%;
        animation-delay: 5s;
    }
    .tech-stack-row {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        animation: fadeInUp 0.8s ease 1s forwards;
        margin-top: 2.5rem;
    }
    .tech-badge {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: #9ca3af;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0.3rem 0.75rem;
        border-radius: 2rem;
        letter-spacing: 0.03em;
        transition: all 0.3s;
    }
    .tech-badge:hover {
        border-color: rgba(20,184,166,0.4);
        color: #2dd4bf;
        background: rgba(20,184,166,0.08);
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatOrb {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-30px) scale(1.1); }
    }
    @media (max-width: 768px) {
        .home-section { padding: 3rem 2rem; }
        .greeting { font-size: 0.9rem; }
        .home-title { font-size: 2.5rem; }
        .home-subtitle { font-size: 1.3rem; }
        .home-description { font-size: 0.95rem; }
        .home-buttons { flex-direction: column; gap: 1rem; }
        .btn-primary, .btn-secondary { width: 100%; justify-content: center; padding: 0.85rem 2rem; }
        .float-orb { display: none; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
        .home-section { padding: 3rem; }
        .home-title { font-size: 3rem; }
        .home-subtitle { font-size: 1.5rem; }
        .home-description { font-size: 1rem; max-width: 500px; }
        .btn-primary, .btn-secondary { padding: 0.85rem 2rem; font-size: 0.95rem; }
    }
    @media (max-width: 480px) {
        .home-section { padding: 2rem 1.2rem; padding-bottom: 4rem; }
        .greeting { font-size: 0.8rem; letter-spacing: 0.12em; }
        .home-title { font-size: 2rem; margin-bottom: 1rem; }
        .home-subtitle { font-size: 1.1rem; margin-bottom: 1.5rem; }
        .home-description { font-size: 0.88rem; margin-bottom: 2rem; line-height: 1.7; }
        .btn-primary, .btn-secondary { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
    }
</style>

<section class="home-section">
    <div class="floating-elements">
        <div class="float-orb"></div>
        <div class="float-orb"></div>
        <div class="float-orb"></div>
    </div>

    <div class="home-content">
        <div class="greeting">✦ Welcome to my portfolio</div>

        <h1 class="home-title">
            Hi, I'm <span>{{ profile.name }}</span>
        </h1>

        <p class="home-subtitle">{{ profile.title }}</p>

        <p class="home-description">{{ profile.bio }}</p>

        <div class="home-buttons">
            <a href="/portfolio/" class="btn-primary spa-link">
                <i class="fas fa-briefcase"></i> View My Work
            </a>
            <a href="/contact/" class="btn-secondary spa-link">
                <i class="fas fa-envelope"></i> Get In Touch
            </a>
        </div>

        <div class="tech-stack-row">
            <span class="tech-badge">Python</span>
            <span class="tech-badge">Django</span>
            <span class="tech-badge">FastAPI</span>
            <span class="tech-badge">PostgreSQL</span>
            <span class="tech-badge">Docker</span>
            <span class="tech-badge">Node.js</span>
        </div>
    </div>
</section>
